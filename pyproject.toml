[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-nhi"
version = "0.1.0"
description = "Synthetic, governed AI-agent authorization and cyber risk decision-support reference"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dashboard = ["streamlit>=1.40,<2", "plotly>=5.24,<7"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
aegis-nhi = "aegis_nhi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
