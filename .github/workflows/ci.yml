name: AEGIS-NHI Evidence CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package and quality tools
        run: python -m pip install -e ".[dev,dashboard]"
      - name: Compile source and dashboard
        run: python -m compileall -q src streamlit_app.py
      - name: Lint for critical failures
        run: ruff check . --select E4,E7,E9,F
      - name: Run evidence and control tests
        run: pytest -q
      - name: Generate deterministic synthetic report
        run: python -m aegis_nhi.cli --output artifacts/nhi_demo_report.json
